name: Build Dioxivet Academy APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate the Android Gradle wrapper and platform files in CI.
      # Do not hand-create android/*.gradle files in GitHub.
      - name: Generate Android platform
        run: flutter create --platforms=android --project-name=dioxivet_academy --org=com.dioxivet .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dioxivet-Academy-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
